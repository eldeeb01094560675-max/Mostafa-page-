DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة الحضور الشهرية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 2rem;
        }

        h1 {
            color: #333;
            margin-bottom: 0.5rem;
            text-align: center;
            font-size: 28px;
        }

        .month-info {
            text-align: center;
            color: #666;
            margin-bottom: 2rem;
            font-size: 14px;
        }

        .add-section {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .add-section input {
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .add-section input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .add-section input[type="text"] {
            flex: 1;
            min-width: 200px;
        }

        .add-section input[type="date"] {
            min-width: 150px;
        }

        .date-display {
            padding: 10px 15px;
            background: #f0f0f0;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #333;
        }

        .btn {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #5568d3;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            background: #667eea;
            color: white;
        }

        th {
            padding: 12px 8px;
            text-align: center;
            font-weight: 600;
        }

        th:first-child {
            text-align: right;
            min-width: 140px;
        }

        tbody tr {
            border-bottom: 1px solid #e0e0e0;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        td {
            padding: 10px 4px;
            text-align: center;
        }

        td:first-child {
            text-align: right;
            padding: 10px 15px;
            font-weight: 500;
            color: #333;
            cursor: pointer;
            min-width: 140px;
            background: #f8f9fa;
            border-right: 2px solid #667eea;
        }

        td:first-child:hover {
            background: #e8eaf6;
        }

        .day-cell {
            padding: 6px 2px;
            cursor: pointer;
            font-weight: 600;
            border-radius: 4px;
            display: inline-block;
            min-width: 24px;
        }

        .day-cell.present {
            background: #d4edda;
            color: #155724;
        }

        .day-cell.absent {
            background: #f8d7da;
            color: #721c24;
        }

        .day-cell.empty {
            background: #f0f0f0;
            color: #999;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #667eea;
            padding-bottom: 1rem;
        }

        .modal-header h2 {
            color: #333;
            font-size: 22px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        .close-btn:hover {
            color: #333;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .stat-item {
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #e0e0e0;
        }

        .stat-item.present {
            background: #d4edda;
            border-color: #155724;
        }

        .stat-item.absent {
            background: #f8d7da;
            border-color: #721c24;
        }

        .stat-label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
        }

        .percentage {
            font-size: 13px;
            margin-top: 8px;
            opacity: 0.8;
        }

        .days-edit-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 1.5rem;
        }

        .day-edit-btn {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: #f8f9fa;
            color: #333;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s;
        }

        .day-edit-btn:hover {
            border-color: #667eea;
        }

        .day-edit-btn.present {
            background: #d4edda;
            border-color: #155724;
            color: #155724;
        }

        .day-edit-btn.absent {
            background: #f8d7da;
            border-color: #721c24;
            color: #721c24;
        }

        .details-section {
            margin-top: 1.5rem;
        }

        .details-section h3 {
            color: #333;
            margin-bottom: 1rem;
            font-size: 16px;
        }

        .days-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .day-tag {
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .day-tag.present {
            background: #d4edda;
            color: #155724;
        }

        .day-tag.absent {
            background: #f8d7da;
            color: #721c24;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 1.5rem;
        }

        .btn-delete {
            flex: 1;
            background: #dc3545;
            padding: 10px;
            font-size: 13px;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .btn-close {
            flex: 1;
            background: #6c757d;
            padding: 10px;
            font-size: 13px;
        }

        .btn-close:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 قائمة الحضور الشهرية</h1>
        <div class="month-info" id="monthDisplay"></div>

        <div class="add-section">
            <input type="text" id="studentInput" placeholder="اسم الطالب الجديد">
            <input type="date" id="dateInput">
            <div class="date-display" id="dateDisplay"></div>
            <button class="btn" onclick="addStudent()"><i class="fas fa-plus"></i> إضافة</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr id="headerRow">
                        <th>اسم الطالب</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="modal" id="detailsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalStudentName"></h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>

            <div class="stats-grid">
                <div class="stat-item present">
                    <div class="stat-label">أيام الحضور</div>
                    <div class="stat-value" id="presentDays">0</div>
                    <div class="percentage" id="presentPercentage">0%</div>
                </div>
                <div class="stat-item absent">
                    <div class="stat-label">أيام الغياب</div>
                    <div class="stat-value" id="absentDays">0</div>
                    <div class="percentage" id="absentPercentage">0%</div>
                </div>
            </div>

            <div>
                <h3>تعديل الأيام</h3>
                <div class="days-edit-grid" id="daysEditGrid"></div>
            </div>

            <div class="details-section">
                <h3>ملخص الحضور</h3>
                <div class="days-list" id="presentDaysList"></div>
            </div>

            <div class="details-section">
                <h3>ملخص الغياب</h3>
                <div class="days-list" id="absentDaysList"></div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-delete" onclick="deleteStudent()"><i class="fas fa-trash"></i> حذف</button>
                <button class="btn btn-close" onclick="closeModal()">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        let students = [];
        let attendance = {}; // attendance[dateKey][studentId][day] = {status, date}
        let selectedStudentId = null;
        let selectedDate = null;
        const daysInMonth = 30;

        function formatArabicDate(dateString) {
            const date = new Date(dateString + 'T00:00:00');
            const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو',
                          'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
            const days = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
            return `${days[date.getDay()]} ${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
        }

        function getMonthDisplay() {
            const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو',
                          'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
            const now = new Date();
            return `${months[now.getMonth()]} ${now.getFullYear()}`;
        }

        function setupTable() {
            const headerRow = document.getElementById('headerRow');
            for (let day = 1; day <= daysInMonth; day++) {
                const th = document.createElement('th');
                th.textContent = `اليوم ${day}`;
                headerRow.appendChild(th);
            }
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (!attendance[selectedDate]) {
                attendance[selectedDate] = {};
            }

            students.forEach(student => {
                const tr = document.createElement('tr');
                
                const nameCell = document.createElement('td');
                nameCell.textContent = student.name;
                nameCell.onclick = () => showStudentDetails(student.id);
                tr.appendChild(nameCell);

                if (!attendance[selectedDate][student.id]) {
                    attendance[selectedDate][student.id] = {};
                }

                for (let day = 1; day <= daysInMonth; day++) {
                    const td = document.createElement('td');
                    const entry = attendance[selectedDate][student.id][day];
                    const status = entry ? entry.status : null;
                    
                    const cell = document.createElement('div');
                    cell.className = 'day-cell';
                    
                    if (status === 'present') {
                        cell.classList.add('present');
                        cell.textContent = '✓';
                        cell.title = entry.date;
                    } else if (status === 'absent') {
                        cell.classList.add('absent');
                        cell.textContent = '✗';
                        cell.title = entry.date;
                    } else {
                        cell.classList.add('empty');
                        cell.textContent = '—';
                    }
                    
                    cell.onclick = (e) => {
                        e.stopPropagation();
                        toggleDay(student.id, day);
                    };
                    
                    td.appendChild(cell);
                    tr.appendChild(td);
                }

                tbody.appendChild(tr);
            });
        }

        function toggleDay(studentId, day) {
            if (!attendance[selectedDate][studentId]) {
                attendance[selectedDate][studentId] = {};
            }

            const entry = attendance[selectedDate][studentId][day];
            const today = formatArabicDate(selectedDate);
            
            if (!entry) {
                attendance[selectedDate][studentId][day] = { status: 'present', date: today };
            } else if (entry.status === 'present') {
                attendance[selectedDate][studentId][day] = { status: 'absent', date: today };
            } else {
                attendance[selectedDate][studentId][day] = null;
            }
            
            renderTable();
        }

        function addStudent() {
            const input = document.getElementById('studentInput');
            const name = input.value.trim();

            if (!name) {
                alert('من فضلك اكتب اسم الطالب');
                return;
            }

            const newId = Math.max(...students.map(s => s.id), 0) + 1;
            students.push({ id: newId, name });

            input.value = '';
            renderTable();
        }

        function showStudentDetails(studentId) {
            selectedStudentId = studentId;
            const student = students.find(s => s.id === studentId);
            document.getElementById('modalStudentName').textContent = student.name;

            const data = attendance[selectedDate][studentId] || {};
            const presentCount = Object.values(data).filter(v => v && v.status === 'present').length;
            const absentCount = Object.values(data).filter(v => v && v.status === 'absent').length;
            const totalDays = presentCount + absentCount;

            document.getElementById('presentDays').textContent = presentCount;
            document.getElementById('absentDays').textContent = absentCount;

            if (totalDays > 0) {
                document.getElementById('presentPercentage').textContent = Math.round((presentCount / totalDays) * 100) + '%';
                document.getElementById('absentPercentage').textContent = Math.round((absentCount / totalDays) * 100) + '%';
            } else {
                document.getElementById('presentPercentage').textContent = '0%';
                document.getElementById('absentPercentage').textContent = '0%';
            }

            // أيام الحضور
            const presentDays = Object.entries(data)
                .filter(([_, v]) => v && v.status === 'present')
                .map(([day, v]) => `<span class="day-tag present" title="${v.date}">اليوم ${day} ✓</span>`);

            document.getElementById('presentDaysList').innerHTML = presentDays.length > 0
                ? presentDays.join('')
                : '<span style="color: #999;">لا توجد أيام حضور</span>';

            // أيام الغياب
            const absentDays = Object.entries(data)
                .filter(([_, v]) => v && v.status === 'absent')
                .map(([day, v]) => `<span class="day-tag absent" title="${v.date}">اليوم ${day} ✗</span>`);

            document.getElementById('absentDaysList').innerHTML = absentDays.length > 0
                ? absentDays.join('')
                : '<span style="color: #999;">لا توجد أيام غياب</span>';

            // تحديث شبكة التعديل
            const grid = document.getElementById('daysEditGrid');
            grid.innerHTML = '';
            for (let day = 1; day <= daysInMonth; day++) {
                const btn = document.createElement('button');
                btn.className = 'day-edit-btn';
                const entry = data[day];
                
                if (entry && entry.status === 'present') {
                    btn.classList.add('present');
                    btn.textContent = `يوم ${day} ✓`;
                    btn.title = entry.date;
                } else if (entry && entry.status === 'absent') {
                    btn.classList.add('absent');
                    btn.textContent = `يوم ${day} ✗`;
                    btn.title = entry.date;
                } else {
                    btn.textContent = `يوم ${day}`;
                }
                
                btn.onclick = () => {
                    toggleDay(studentId, day);
                    showStudentDetails(studentId);
                };
                
                grid.appendChild(btn);
            }

            document.getElementById('detailsModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('detailsModal').classList.remove('show');
            selectedStudentId = null;
        }

        function deleteStudent() {
            if (!selectedStudentId) return;

            const student = students.find(s => s.id === selectedStudentId);
            if (confirm(`هل أنت متأكد من حذف ${student.name}؟`)) {
                students = students.filter(s => s.id !== selectedStudentId);
                Object.keys(attendance).forEach(date => {
                    delete attendance[date][selectedStudentId];
                });
                closeModal();
                renderTable();
            }
        }

        // Event listeners
        document.getElementById('studentInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addStudent();
        });

        document.getElementById('detailsModal').addEventListener('click', (e) => {
            if (e.target.id === 'detailsModal') closeModal();
        });

        document.getElementById('dateInput').addEventListener('change', (e) => {
            selectedDate = e.target.value;
            if (selectedDate) {
                document.getElementById('dateDisplay').textContent = '📅 ' + formatArabicDate(selectedDate);
            } else {
                document.getElementById('dateDisplay').textContent = '';
            }
            renderTable();
        });

        // Initialize
        document.getElementById('monthDisplay').textContent = getMonthDisplay();
        const today = new Date();
        document.getElementById('dateInput').valueAsDate = today;
        selectedDate = today.toISOString().split('T')[0];
        document.getElementById('dateDisplay').textContent = '📅 ' + formatArabicDate(selectedDate);
        setupTable();
        renderTable();
    </script>
</body>
</html>
