<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة الحضور - 8 حصص</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 2rem;
        }

        h1 {
            color: #333;
            text-align: center;
            font-size: 28px;
            margin-bottom: 1.5rem;
        }

        .add-section {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .add-section input {
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .add-section input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .add-section input[type="text"] {
            flex: 1;
            min-width: 200px;
        }

        .btn {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #5568d3;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            background: #667eea;
            color: white;
        }

        th {
            padding: 12px 8px;
            text-align: center;
            font-weight: 600;
        }

        th:first-child {
            text-align: right;
            min-width: 140px;
        }

        tbody tr {
            border-bottom: 1px solid #e0e0e0;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        td {
            padding: 10px 4px;
            text-align: center;
        }

        td:first-child {
            text-align: right;
            padding: 10px 15px;
            font-weight: 500;
            color: #333;
            cursor: pointer;
            min-width: 140px;
            background: #f8f9fa;
            border-right: 2px solid #667eea;
        }

        td:first-child:hover {
            background: #e8eaf6;
        }

        .day-cell {
            padding: 6px 2px;
            cursor: pointer;
            font-weight: 600;
            border-radius: 4px;
            display: inline-block;
            min-width: 24px;
        }

        .day-cell.present {
            background: #d4edda;
            color: #155724;
        }

        .day-cell.absent {
            background: #f8d7da;
            color: #721c24;
        }

        .day-cell.empty {
            background: #f0f0f0;
            color: #999;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            max-width: 700px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #667eea;
            padding-bottom: 1rem;
        }

        .modal-header h2 {
            color: #333;
            font-size: 22px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        .close-btn:hover {
            color: #333;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .stat-item {
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #e0e0e0;
        }

        .stat-item.present {
            background: #d4edda;
            border-color: #155724;
        }

        .stat-item.absent {
            background: #f8d7da;
            border-color: #721c24;
        }

        .stat-label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
        }

        .percentage {
            font-size: 13px;
            margin-top: 8px;
            opacity: 0.8;
        }

        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .lesson-item {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
        }

        .lesson-item.present {
            background: #d4edda;
            border-color: #155724;
        }

        .lesson-item.absent {
            background: #f8d7da;
            border-color: #721c24;
        }

        .lesson-item.empty {
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s;
        }

        .lesson-item.empty:hover {
            border-color: #667eea;
            background: #f0f1f3;
        }

        .lesson-number {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .lesson-status {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .lesson-date {
            font-size: 11px;
            color: #666;
        }

        .details-section {
            margin-top: 1.5rem;
        }

        .details-section h3 {
            color: #333;
            margin-bottom: 1rem;
            font-size: 16px;
        }

        .lesson-detail {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-right: 4px solid;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lesson-detail.present {
            background: #d4edda;
            color: #155724;
            border-right-color: #155724;
        }

        .lesson-detail.absent {
            background: #f8d7da;
            color: #721c24;
            border-right-color: #721c24;
        }

        .lesson-detail strong {
            font-weight: 600;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 1.5rem;
        }

        .btn-delete {
            flex: 1;
            background: #dc3545;
            padding: 10px;
            font-size: 13px;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .btn-close {
            flex: 1;
            background: #6c757d;
            padding: 10px;
            font-size: 13px;
        }

        .btn-close:hover {
            background: #5a6268;
        }

        .modal-date-input {
            display: flex;
            gap: 8px;
            margin-bottom: 1rem;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .modal-date-input input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }

        .modal-date-input button {
            padding: 8px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .modal-date-input button:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 قائمة الحضور - 8 حصص</h1>

        <div class="add-section">
            <input type="text" id="studentInput" placeholder="اسم الطالب الجديد">
            <button class="btn" onclick="addStudent()"><i class="fas fa-plus"></i> إضافة</button>
        </div>
        <div id="addStudentError" style="display:none; color:#721c24; background:#f8d7da; padding:8px 12px; border-radius:6px; font-size:13px; margin-bottom:1rem;"></div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr id="headerRow">
                        <th>اسم الطالب</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="modal" id="detailsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalStudentName"></h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>

            <div class="stats-grid">
                <div class="stat-item present">
                    <div class="stat-label">أيام الحضور</div>
                    <div class="stat-value" id="presentDays">0</div>
                    <div class="percentage" id="presentPercentage">0%</div>
                </div>
                <div class="stat-item absent">
                    <div class="stat-label">أيام الغياب</div>
                    <div class="stat-value" id="absentDays">0</div>
                    <div class="percentage" id="absentPercentage">0%</div>
                </div>
            </div>

            <div>
                <h3>تعديل الحصص</h3>
                <div class="lessons-grid" id="lessonsGrid"></div>
            </div>

            <div class="details-section">
                <h3>ملخص الحضور</h3>
                <div id="presentLessonsList"></div>
            </div>

            <div class="details-section">
                <h3>ملخص الغياب</h3>
                <div id="absentLessonsList"></div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-delete" onclick="deleteStudent()"><i class="fas fa-trash"></i> حذف</button>
                <button class="btn btn-close" onclick="closeModal()">إغلاق</button>
            </div>
        </div>
    </div>

    <div class="modal" id="dateModal">
        <div class="modal-content" style="max-width: 360px;">
            <div class="modal-header">
                <h2 id="dateModalTitle">إدخال التاريخ</h2>
                <button class="close-btn" onclick="closeDateModal()">&times;</button>
            </div>
            <div class="modal-date-input">
                <input type="date" id="dateModalInput">
            </div>
            <div id="dateModalError" style="display:none; color:#721c24; background:#f8d7da; padding:8px 12px; border-radius:6px; font-size:13px; margin-bottom:1rem;"></div>
            <div class="action-buttons">
                <button class="btn" style="flex:1;" onclick="confirmDateModal()">حفظ</button>
                <button class="btn btn-close" onclick="closeDateModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <div class="modal" id="confirmModal">
        <div class="modal-content" style="max-width: 360px;">
            <div class="modal-header">
                <h2>تأكيد الحذف</h2>
            </div>
            <p id="confirmModalText" style="margin-bottom: 1.5rem;"></p>
            <div class="action-buttons">
                <button class="btn btn-delete" onclick="confirmDeleteYes()">حذف</button>
                <button class="btn btn-close" onclick="closeConfirmModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        let students = [];
        let attendance = {}; // attendance[studentId][lessonNum] = {status, date}
        let selectedStudentId = null;
        const lessonsCount = 8;

        function formatArabicDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString + 'T00:00:00');
            const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو',
                          'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
            const days = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
            return `${days[date.getDay()]} ${date.getDate()} ${months[date.getMonth()]}`;
        }

        function setupTable() {
            const headerRow = document.getElementById('headerRow');
            for (let lesson = 1; lesson <= lessonsCount; lesson++) {
                const th = document.createElement('th');
                th.textContent = `الحصة ${lesson}`;
                headerRow.appendChild(th);
            }
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            students.forEach(student => {
                const tr = document.createElement('tr');
                
                const nameCell = document.createElement('td');
                nameCell.textContent = student.name;
                nameCell.onclick = () => showStudentDetails(student.id);
                tr.appendChild(nameCell);

                if (!attendance[student.id]) {
                    attendance[student.id] = {};
                }

                for (let lesson = 1; lesson <= lessonsCount; lesson++) {
                    const td = document.createElement('td');
                    const entry = attendance[student.id][lesson];
                    const status = entry ? entry.status : null;
                    
                    const cell = document.createElement('div');
                    cell.className = 'day-cell';
                    
                    if (status === 'present') {
                        cell.classList.add('present');
                        cell.textContent = '✓';
                        cell.title = entry.date ? formatArabicDate(entry.date) : '';
                    } else if (status === 'absent') {
                        cell.classList.add('absent');
                        cell.textContent = '✗';
                        cell.title = entry.date ? formatArabicDate(entry.date) : '';
                    } else {
                        cell.classList.add('empty');
                        cell.textContent = '—';
                    }
                    
                    cell.onclick = (e) => {
                        e.stopPropagation();
                        toggleLesson(student.id, lesson);
                    };
                    
                    td.appendChild(cell);
                    tr.appendChild(td);
                }

                tbody.appendChild(tr);
            });
        }

        function toggleLesson(studentId, lesson) {
            if (!attendance[studentId]) {
                attendance[studentId] = {};
            }

            const entry = attendance[studentId][lesson];

            if (entry && entry.status === 'present') {
                openDateModal(studentId, lesson, 'absent', entry.date, false);
            } else if (entry && entry.status === 'absent') {
                attendance[studentId][lesson] = null;
                renderTable();
            } else {
                openDateModal(studentId, lesson, 'present', '', false);
            }
        }

        let pendingDate = null;

        function openDateModal(studentId, lesson, newStatus, currentDate, fromDetails) {
            pendingDate = { studentId, lesson, newStatus, fromDetails };
            document.getElementById('dateModalTitle').textContent = newStatus === 'present'
                ? `تاريخ الحضور - الحصة ${lesson}`
                : `تاريخ الغياب - الحصة ${lesson}`;
            document.getElementById('dateModalInput').value = currentDate || new Date().toISOString().slice(0, 10);
            document.getElementById('dateModalError').style.display = 'none';
            document.getElementById('dateModal').classList.add('show');
        }

        function closeDateModal() {
            document.getElementById('dateModal').classList.remove('show');
            pendingDate = null;
        }

        function confirmDateModal() {
            const dateString = document.getElementById('dateModalInput').value;
            const errorEl = document.getElementById('dateModalError');

            if (!dateString) {
                errorEl.textContent = 'يجب اختيار التاريخ';
                errorEl.style.display = 'block';
                return;
            }

            const { studentId, lesson, newStatus, fromDetails } = pendingDate;
            if (!attendance[studentId]) attendance[studentId] = {};
            attendance[studentId][lesson] = { status: newStatus, date: dateString };

            document.getElementById('dateModal').classList.remove('show');
            pendingDate = null;

            renderTable();
            if (fromDetails) {
                showStudentDetails(studentId);
            }
        }

        function addStudent() {
            const input = document.getElementById('studentInput');
            const name = input.value.trim();
            const errorEl = document.getElementById('addStudentError');

            if (!name) {
                errorEl.textContent = 'من فضلك اكتب اسم الطالب';
                errorEl.style.display = 'block';
                return;
            }
            errorEl.style.display = 'none';

            const newId = Math.max(...students.map(s => s.id), 0) + 1;
            students.push({ id: newId, name });
            attendance[newId] = {};

            input.value = '';
            renderTable();
        }

        function setLessonDate(studentId, lesson, dateString) {
            if (!attendance[studentId][lesson]) {
                attendance[studentId][lesson] = { status: null, date: dateString };
            } else {
                attendance[studentId][lesson].date = dateString;
            }
        }

        function showStudentDetails(studentId) {
            selectedStudentId = studentId;
            const student = students.find(s => s.id === studentId);
            document.getElementById('modalStudentName').textContent = student.name;

            const data = attendance[studentId] || {};
            const presentCount = Object.values(data).filter(v => v && v.status === 'present').length;
            const absentCount = Object.values(data).filter(v => v && v.status === 'absent').length;
            const totalDays = presentCount + absentCount;

            document.getElementById('presentDays').textContent = presentCount;
            document.getElementById('absentDays').textContent = absentCount;

            if (totalDays > 0) {
                document.getElementById('presentPercentage').textContent = Math.round((presentCount / totalDays) * 100) + '%';
                document.getElementById('absentPercentage').textContent = Math.round((absentCount / totalDays) * 100) + '%';
            } else {
                document.getElementById('presentPercentage').textContent = '0%';
                document.getElementById('absentPercentage').textContent = '0%';
            }

            // شبكة الحصص
            const grid = document.getElementById('lessonsGrid');
            grid.innerHTML = '';
            for (let lesson = 1; lesson <= lessonsCount; lesson++) {
                const entry = data[lesson];
                const status = entry ? entry.status : null;
                const date = entry ? entry.date : null;

                const div = document.createElement('div');
                div.className = 'lesson-item ' + (status || 'empty');
                
                div.innerHTML = `
                    <div class="lesson-number">الحصة ${lesson}</div>
                    ${status ? `<div class="lesson-status">${status === 'present' ? '✓' : '✗'}</div>` : ''}
                    ${date ? `<div class="lesson-date">${formatArabicDate(date)}</div>` : ''}
                    ${!status ? '<small style="color: #999;">اضغط لإضافة</small>' : ''}
                `;

                div.onclick = () => {
                    showDatePicker(studentId, lesson);
                };

                grid.appendChild(div);
            }

            // ملخص الحضور
            const presentLessons = Object.entries(data)
                .filter(([_, v]) => v && v.status === 'present')
                .map(([lesson, v]) => `<div class="lesson-detail present"><span>حضر الحصة ${lesson}</span><strong>${formatArabicDate(v.date)}</strong></div>`);

            document.getElementById('presentLessonsList').innerHTML = presentLessons.length > 0
                ? presentLessons.join('')
                : '<div style="color: #999;">لا توجد أيام حضور</div>';

            // ملخص الغياب
            const absentLessons = Object.entries(data)
                .filter(([_, v]) => v && v.status === 'absent')
                .map(([lesson, v]) => `<div class="lesson-detail absent"><span>غاب الحصة ${lesson}</span><strong>${formatArabicDate(v.date)}</strong></div>`);

            document.getElementById('absentLessonsList').innerHTML = absentLessons.length > 0
                ? absentLessons.join('')
                : '<div style="color: #999;">لا توجد أيام غياب</div>';

            document.getElementById('detailsModal').classList.add('show');
        }

        function showDatePicker(studentId, lesson) {
            const currentEntry = attendance[studentId][lesson];

            if (currentEntry && currentEntry.status === 'present') {
                openDateModal(studentId, lesson, 'absent', currentEntry.date, true);
            } else if (currentEntry && currentEntry.status === 'absent') {
                attendance[studentId][lesson] = null;
                showStudentDetails(studentId);
            } else {
                openDateModal(studentId, lesson, 'present', '', true);
            }
        }

        function closeModal() {
            document.getElementById('detailsModal').classList.remove('show');
            selectedStudentId = null;
        }

        function deleteStudent() {
            if (!selectedStudentId) return;
            const student = students.find(s => s.id === selectedStudentId);
            document.getElementById('confirmModalText').textContent = `هل أنت متأكد من حذف ${student.name}؟`;
            document.getElementById('confirmModal').classList.add('show');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('show');
        }

        function confirmDeleteYes() {
            students = students.filter(s => s.id !== selectedStudentId);
            delete attendance[selectedStudentId];
            closeConfirmModal();
            closeModal();
            renderTable();
        }

        // Event listeners
        document.getElementById('studentInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addStudent();
        });

        document.getElementById('detailsModal').addEventListener('click', (e) => {
            if (e.target.id === 'detailsModal') closeModal();
        });

        document.getElementById('dateModal').addEventListener('click', (e) => {
            if (e.target.id === 'dateModal') closeDateModal();
        });

        document.getElementById('confirmModal').addEventListener('click', (e) => {
            if (e.target.id === 'confirmModal') closeConfirmModal();
        });

        // Initialize
        setupTable();
        renderTable();
    </script>
</body>
</html>
